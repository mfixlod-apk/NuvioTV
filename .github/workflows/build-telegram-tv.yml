name: Build Nuvio TV Telegram

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUVIO_SUPABASE_URL: https://api.nuvio.tv
      NUVIO_SUPABASE_ANON_KEY: sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
      NUVIO_SUPABASE_FALLBACK_URL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Download TDLib runtime
        shell: bash
        run: |
          set -e
          mkdir -p app/libs app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86,x86_64}
          curl -L --fail https://raw.githubusercontent.com/NuvioMedia/NuvioMobile/f5d401edf69e528ebc9d6b334073a7d04aeddfc1/composeApp/libs/tdlib.jar -o app/libs/tdlib.jar
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            curl -L --fail https://raw.githubusercontent.com/NuvioMedia/NuvioMobile/f5d401edf69e528ebc9d6b334073a7d04aeddfc1/composeApp/src/androidMain/jniLibs/$abi/libtdjni.so -o app/src/main/jniLibs/$abi/libtdjni.so
          done
      - name: Add TDLib dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          marker='dependencies {'
          if 'implementation(files("libs/tdlib.jar"))' not in s:
              s=s.replace(marker, marker+'\n    implementation(files("libs/tdlib.jar"))',1)
          p.write_text(s)
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build TV APK
        run: ./gradlew :app:assembleFullDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Telegram
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
